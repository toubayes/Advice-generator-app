<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Get a random piece of advice with a roll of the dice.">
  <meta property="og:title" content="Advice generator app">
  <meta property="og:description" content="Get a random piece of advice with a roll of the dice.">
  <meta property="og:image" content="https://toubayes.github.io/Advice-generator-app/screenshot.jpg">
  <meta property="og:url" content="https://toubayes.github.io/Advice-generator-app/">
  <meta name="theme-color" content="#1f2632">

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

  <title>Frontend Mentor | Advice generator app</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="document">
    <article class="advise-box">
      <h1 class="advice-id">Advice <span class="num">#117</span></h1>
      <blockquote class="text-advicd" aria-live="polite">
        &ldquo;It is easy to sit up and take notice, what's difficult is getting up and taking action.&rdquo;
      </blockquote>

      <picture>
        <source media="(min-width: 600px)" srcset="images/pattern-divider-desktop.svg">
        <img src="images/pattern-divider-mobile.svg" alt="" class="line">
      </picture>

      <button type="button" class="img-btn" aria-label="Get new advice">
        <img src="images/icon-dice.svg" alt="" class="rood">
      </button>
    </article>
  </main>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank" rel="noopener">Frontend Mentor</a>.
    Coded by <a href="https://github.com/toubayes">Youcef Laala</a>.
  </footer>
  <script src="js/script.js"></script>
</body>
</html>
